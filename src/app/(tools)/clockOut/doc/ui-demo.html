<title>下班倒數 · EXP Demo</title>
<style>
  :root {
    --bg: #0e1220;
    --bg2: #0a0d18;
    --panel: #1a2136;
    --panel-2: #141a2b;
    --edge-lo: #05070d;
    --ink: #eaf0ff;
    --muted: #8b95b5;
    --exp-hi: #ccff4d;
    --exp-top: #a4e800;
    --exp-mid: #7dc400;
    --exp-bot: #3f8300;
    --exp-trough: #0a1005;
    --amber: #ffb02e;
    --amber-dk: #b96f00;
    --mono: "Courier New", ui-monospace, "Cascadia Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 50% -10%, #1b2440 0%, var(--bg) 55%, var(--bg2) 100%);
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: none;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 56px;
    gap: 22px;
  }

  .kicker {
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 11px;
    color: var(--amber);
    text-shadow: 2px 2px 0 #000;
  }
  .kicker b { color: var(--exp-top); }

  /* ===== retro handheld screen ===== */
  .console {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .screen {
    position: relative;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 3px solid #000;
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,.08),
      inset -2px -2px 0 rgba(0,0,0,.55),
      0 0 0 3px #263056,
      0 10px 0 rgba(0,0,0,.45),
      0 22px 40px rgba(0,0,0,.55);
    padding: 22px 20px 24px;
    overflow: hidden;
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);
    mix-blend-mode: multiply;
    opacity: .5;
  }

  .screen-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 6px;
  }
  .now-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .now-clock {
    font-size: 26px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    text-shadow: 2px 2px 0 #000;
  }
  .status-pill {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 5px 8px;
    border: 2px solid #000;
    background: #26305a;
    color: var(--exp-hi);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.15), 2px 2px 0 #000;
    white-space: nowrap;
  }

  .count-block {
    margin: 18px 0 22px;
    text-align: center;
  }
  .count-cap {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 #000;
  }
  .count-main {
    font-weight: 700;
    line-height: .92;
    letter-spacing: 0;
    text-shadow: 4px 4px 0 #000, 0 0 26px rgba(164,232,0,.35);
    display: flex;
    align-items: baseline;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0 2px;
  }
  .count-main .n {
    color: var(--exp-hi);
    font-variant-numeric: tabular-nums;
    font-size: clamp(72px, 26vw, 128px);
  }
  .count-main .u {
    color: var(--amber);
    font-size: clamp(22px, 7vw, 34px);
    margin: 0 4px 0 6px;
  }

  /* ===== EXP BAR (the hero) ===== */
  .exp-wrap { margin-top: 4px; }
  .exp-meta {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .expbar {
    position: relative;
    height: 30px;
    background: var(--exp-trough);
    border: 3px solid #000;
    box-shadow:
      inset 2px 2px 0 rgba(0,0,0,.8),
      inset -1px -1px 0 rgba(255,255,255,.06),
      0 0 0 2px #2a3560;
    overflow: hidden;
    image-rendering: pixelated;
  }
  .exp-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background:
      linear-gradient(180deg,
        var(--exp-hi) 0%,
        var(--exp-top) 42%,
        var(--exp-mid) 60%,
        var(--exp-bot) 100%);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.28);
    transition: width .35s cubic-bezier(.4,1.4,.5,1);
  }
  .exp-fill::before { /* top gloss */
    content: "";
    position: absolute;
    inset: 2px 2px auto 2px;
    height: 8px;
    background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0));
    border-radius: 2px;
  }
  .exp-fill::after { /* moving shine */
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 26px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    animation: shine 2.6s linear infinite;
  }
  @keyframes shine { 0% { left: -30px; } 100% { left: 110%; } }

  .exp-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 9px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    pointer-events: none;
  }
  .exp-text .exp-k { color: var(--exp-hi); }

  /* cheer */
  .rank-row {
    display: flex;
    justify-content: center;
    margin-top: 18px;
  }
  .cheer {
    font-size: 15px;
    color: var(--ink);
    line-height: 1.5;
    text-align: center;
    text-shadow: 1px 1px 0 #000;
    min-height: 1.5em;
  }

  /* inline capy when done */
  .done-inline {
    display: none;
    margin-top: 16px;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border: 2px dashed var(--amber-dk);
    background: rgba(255,176,46,.06);
  }
  .done-inline.show { display: flex; }
  .done-inline img { width: 64px; height: 64px; image-rendering: auto; }
  .done-inline b { color: var(--amber); font-size: 15px; }

  /* ===== controls ===== */
  .controls {
    border: 3px solid #000;
    background: linear-gradient(180deg, #202844, #171d31);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.06), inset -2px -2px 0 rgba(0,0,0,.5), 0 8px 0 rgba(0,0,0,.4);
    padding: 18px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .ctrl-title {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* collapsible settings */
  .settings-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--ink);
    background: #26305a;
    border: 2px solid #000;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.15), 2px 2px 0 #000;
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
  }
  .settings-toggle:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .settings-toggle .st-left { color: var(--exp-hi); white-space: nowrap; }
  .settings-toggle .st-summary {
    flex: 1;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .settings-toggle .st-chev { color: var(--amber); font-size: 12px; }

  .settings-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .28s ease;
  }
  .settings-body > * { overflow: hidden; }
  .settings-body.open { grid-template-rows: 1fr; }
  .settings-inner {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-top: 14px;
  }

  .settings-actions { display: flex; flex-direction: column; gap: 8px; }
  .save-btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 10px 12px;
    border: 2px solid #000;
    background: linear-gradient(180deg, var(--exp-top), var(--exp-bot));
    color: #06210a;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.25), 2px 2px 0 #000;
    cursor: pointer;
  }
  .save-btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .reset-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    padding: 7px 10px;
    border: 2px solid #000;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--amber); }

  .times { display: flex; gap: 12px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--ink);
  }
  .field label .dot { color: var(--exp-top); }
  .field input[type="time"] {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    background: var(--bg2);
    border: 2px solid #000;
    box-shadow: inset 2px 2px 0 rgba(0,0,0,.6);
    padding: 8px 10px;
    color-scheme: dark;
  }

  .tm { display: flex; flex-direction: column; gap: 8px; }
  .tm-head { display: flex; justify-content: space-between; align-items: baseline; }
  .tm-head .tm-val { color: var(--exp-hi); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tm-head .tm-cap { font-size: 11px; letter-spacing: 1px; color: var(--ink); }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 14px;
    background: var(--bg2);
    border: 2px solid #000;
    box-shadow: inset 2px 2px 0 rgba(0,0,0,.6);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 22px;
    background: linear-gradient(180deg, var(--exp-hi), var(--exp-bot));
    border: 2px solid #000;
    box-shadow: 2px 2px 0 rgba(0,0,0,.5);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 22px; border: 2px solid #000;
    background: linear-gradient(180deg, var(--exp-hi), var(--exp-bot));
    cursor: pointer;
  }
  .real-row { display: flex; align-items: center; gap: 10px; }
  .real-row button {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 12px;
    border: 2px solid #000;
    background: #26305a;
    color: var(--ink);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.15), 2px 2px 0 #000;
    cursor: pointer;
  }
  .real-row button.on { background: linear-gradient(180deg, var(--exp-top), var(--exp-bot)); color: #06210a; }
  .real-row button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .real-hint { font-size: 11px; color: var(--muted); }

  .legend {
    max-width: 460px;
    width: 100%;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
    text-align: center;
  }
  .legend b { color: var(--exp-top); }

  /* ===== celebration overlay ===== */
  .celebrate {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: rgba(5,7,14,.86);
    z-index: 50;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  .celebrate.show { display: flex; animation: fadein .3s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; }
  .celebrate .capy {
    width: min(240px, 62vw);
    height: auto;
    image-rendering: auto;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.4));
    animation: bounce 1s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-2deg);} 50% { transform: translateY(-16px) rotate(2deg);} }
  .celebrate h2 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 3px;
    color: var(--exp-hi);
    text-shadow: 3px 3px 0 #000, 0 0 20px rgba(164,232,0,.5);
    position: relative; z-index: 2;
  }
  .celebrate p { margin: 0; color: var(--amber); font-size: 14px; letter-spacing: 2px; position: relative; z-index: 2; }
  .celebrate small { color: var(--muted); font-size: 11px; letter-spacing: 2px; position: relative; z-index: 2; }

  @media (prefers-reduced-motion: reduce) {
    .exp-fill, .exp-fill::after, .celebrate .capy, .celebrate.show { animation: none; }
    .exp-fill { transition: none; }
  }
</style>

<div class="kicker">子yee 萬事屋 · <b>下班倒數</b> · EXP DEMO</div>

<div class="console">
  <!-- SCREEN -->
  <div class="screen">
    <div class="screen-top">
      <div>
        <div class="now-label">現在時間</div>
        <div class="now-clock" id="nowClock">13:32</div>
      </div>
      <div class="status-pill" id="statusPill">上班中</div>
    </div>

    <div class="count-block">
      <div class="count-cap" id="countCap">距離下班還有</div>
      <div class="count-main" id="countMain">—</div>
    </div>

    <div class="exp-wrap">
      <div class="exp-meta"><span>EXP</span><span id="expPctMeta">0.00%</span></div>
      <div class="expbar">
        <div class="exp-fill" id="expFill"></div>
        <div class="exp-text">
          <span class="exp-k">EXP</span>
          <span id="expText">0 [0.00%]</span>
        </div>
      </div>
    </div>

    <div class="rank-row">
      <div class="cheer" id="cheer">開工！深呼吸，今天也要活著下班 😤</div>
    </div>

    <div class="done-inline" id="doneInline">
      <img id="doneImgInline" alt="下班啦水豚君" />
      <div><b>下班啦！</b><br><span style="font-size:12px;color:var(--muted)">今天也辛苦了，快跑 🏃</span></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="true">
      <span class="st-left">⚙ 時間設定</span>
      <span class="st-summary" id="settingsSummary">上班 09:00 · 下班 17:55</span>
      <span class="st-chev" id="chev">▾</span>
    </button>

    <div class="settings-body" id="settingsBody">
      <div class="settings-inner">
        <div class="times">
          <div class="field">
            <label><span class="dot">▸</span> 上班時間</label>
            <input type="time" id="startTime" value="09:00" />
          </div>
          <div class="field">
            <label><span class="dot">▸</span> 下班時間</label>
            <input type="time" id="endTime" value="17:55" />
          </div>
        </div>
        <div class="settings-actions">
          <button class="save-btn" id="saveBtn" type="button">✓ 儲存並收合</button>
          <button class="reset-btn" id="resetBtn" type="button">清除設定（測試預設彈出）</button>
        </div>
      </div>
    </div>

    <div class="tm">
      <div class="tm-head">
        <span class="tm-cap">◆ 時光機（拖動預覽一整天）</span>
        <span class="tm-val" id="tmVal">13:32</span>
      </div>
      <input type="range" id="tmSlider" min="0" max="1439" step="1" value="812" />
    </div>

    <div class="real-row">
      <button id="realBtn" type="button">使用真實時間</button>
      <span class="real-hint" id="realHint">目前：預覽模式</span>
    </div>
  </div>
</div>

<div class="legend">
  進度公式 <b>(現在 − 上班) ÷ (下班 − 上班)</b>　·　拖動時光機或按「使用真實時間」<br>
  滿 100% 會出現水豚君達成畫面 🦫
</div>

<!-- CELEBRATION -->
<div class="celebrate" id="celebrate">
  <canvas id="confetti"></canvas>
  <img class="capy" id="doneImg" alt="下班啦水豚君" />
  <h2>下班啦！</h2>
  <p id="celebrateCheer">你自由了 🕊️</p>
  <small>點擊任意處關閉</small>
</div>

  ];
  const cheerFor = (pct) => CHEERS[Math.max(0, Math.min(100, Math.floor(pct)))];

  function currentMinutes() {
    if (realMode) { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }
    return Number(tm.value);
  }

  function render() {
    let start = parseHM(startEl.value);
    let end = parseHM(endEl.value);
    let cur = currentMinutes();

    const crossnight = end <= start;
    if (crossnight) end += 1440;
    if (crossnight && cur < start) cur += 1440;

    $("nowClock").textContent = fmtHM(cur);
    tmVal.textContent = fmtHM(cur);

    let status, pct, remainLabel, cap;

    if (cur < start) {
      // 尚未開工
      status = "尚未開工";
      pct = 0;
      cap = "距離上班還有";
      remainLabel = fmtRemain(start - cur);
    } else if (cur >= end) {
      status = "已下班";
      pct = 100;
      cap = "狀態";
      remainLabel = "自由了！";
    } else {
      status = "上班中";
      pct = ((cur - start) / (end - start)) * 100;
      cap = "距離下班還有";
      remainLabel = fmtRemain(end - cur);
    }

    const totalSec = Math.max(1, (end - start)) * 60;
    const expNum = Math.floor((pct / 100) * totalSec);

    $("statusPill").textContent = status;
    $("countCap").textContent = cap;
    $("countMain").innerHTML = remainLabel;
    $("expFill").style.width = pct.toFixed(2) + "%";
    $("expText").textContent = expNum.toLocaleString() + " [" + pct.toFixed(2) + "%]";
    $("expPctMeta").textContent = pct.toFixed(2) + "%";

    let cheer;
    if (status === "尚未開工") cheer = "還沒開工，享受最後的自由 😌";
    else cheer = cheerFor(pct);
    $("cheer").textContent = cheer;

    $("doneInline").classList.toggle("show", pct >= 100);

    const isDone = pct >= 100;
    if (isDone && !wasDone) { $("celebrateCheer").textContent = cheer; showCelebrate(); }
    if (!isDone) hideCelebrate();
    wasDone = isDone;
  }

  function fmtRemain(mins) {
    mins = Math.max(0, Math.round(mins));
    const h = Math.floor(mins / 60), m = mins % 60;
    if (h === 0) return '<span class="n">' + m + '</span><span class="u">分</span>';
    return '<span class="n">' + h + '</span><span class="u">小時</span><span class="n">' + m + '</span><span class="u">分</span>';
  }

  // ---- celebration + confetti ----
  const celebrate = $("celebrate");
  const canvas = $("confetti");
  const ctx = canvas.getContext("2d");
  let particles = [], anim = null;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS = ["#ccff4d", "#a4e800", "#ffb02e", "#ffffff", "#7dc400"];

  function showCelebrate() {
    celebrate.classList.add("show");
    if (reduced) return;
    resizeCanvas();
    particles = [];
    for (let i = 0; i < 140; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height,
        s: 6 + Math.random() * 8,
        vy: 2 + Math.random() * 4,
        vx: -1.5 + Math.random() * 3,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        rot: Math.random() * Math.PI,
        vr: -0.2 + Math.random() * 0.4,
      });
    }
    if (anim) cancelAnimationFrame(anim);
    loop();
  }
  function hideCelebrate() {
    celebrate.classList.remove("show");
    if (anim) { cancelAnimationFrame(anim); anim = null; }
  }
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.restore();
    }
    anim = requestAnimationFrame(loop);
  }
  celebrate.addEventListener("click", () => { celebrate.classList.remove("show"); if (anim) { cancelAnimationFrame(anim); anim = null; } });
  window.addEventListener("resize", () => { if (celebrate.classList.contains("show")) resizeCanvas(); });

  // ---- settings persistence + collapse ----
  const KEY = "clockOut:settings";
  const settingsToggle = $("settingsToggle");
  const settingsBody = $("settingsBody");
  const settingsSummary = $("settingsSummary");
  const chev = $("chev");

  function updateSummary() {
    settingsSummary.textContent = "上班 " + startEl.value + " · 下班 " + endEl.value;
  }
  function setOpen(open) {
    settingsBody.classList.toggle("open", open);
    chev.textContent = open ? "▴" : "▾";
    settingsToggle.setAttribute("aria-expanded", String(open));
  }
  function saveSettings() {
    localStorage.setItem(KEY, JSON.stringify({ startTime: startEl.value, endTime: endEl.value }));
    updateSummary();
  }
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
  }

  // 初始化：已設定過 → 收合；尚未設定 → 預設彈出引導
  const saved = loadSettings();
  if (saved && saved.startTime && saved.endTime) {
    startEl.value = saved.startTime;
    endEl.value = saved.endTime;
    setOpen(false);
  } else {
    setOpen(true);
  }
  updateSummary();

  settingsToggle.addEventListener("click", () => setOpen(!settingsBody.classList.contains("open")));
  $("saveBtn").addEventListener("click", () => { saveSettings(); setOpen(false); render(); });
  $("resetBtn").addEventListener("click", () => {
    localStorage.removeItem(KEY);
    setOpen(true);
    settingsSummary.textContent = "尚未設定";
  });

  // ---- events ----
  [startEl, endEl].forEach((el) => el.addEventListener("input", () => { saveSettings(); render(); }));
  tm.addEventListener("input", () => { if (realMode) toggleReal(); render(); });
  realBtn.addEventListener("click", toggleReal);
  function toggleReal() {
    realMode = !realMode;
    realBtn.classList.toggle("on", realMode);
    realBtn.textContent = realMode ? "● 真實時間 ON" : "使用真實時間";
    realHint.textContent = realMode ? "目前：跟著系統時鐘走" : "目前：預覽模式";
    tm.disabled = realMode;
    if (realMode) { render(); realTimer = setInterval(render, 1000); }
    else if (realTimer) { clearInterval(realTimer); realTimer = null; }
  }

  render();
</script>
